<svg width="900" height="200" viewBox="0 0 900 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e2a5e">
        <animate attributeName="stop-color" values="#1e2a5e;#5b2a86;#1e2a5e" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#5b2a86">
        <animate attributeName="stop-color" values="#5b2a86;#8b3a9e;#5b2a86" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#8b3a9e">
        <animate attributeName="stop-color" values="#8b3a9e;#1e2a5e;#8b3a9e" dur="6s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <clipPath id="revealClip">
      <rect x="0" y="0" width="0" height="200">
        <animate attributeName="width" from="0" to="900" dur="2.5s" begin="0s" fill="freeze" calcMode="spline" keySplines="0.25 0.1 0.25 1"/>
      </rect>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="900" height="200" fill="url(#bgGrad)"/>

  <!-- Wave shape at bottom -->
  <path fill="#0d1117" opacity="0.25">
    <animate attributeName="d" dur="8s" repeatCount="indefinite"
      values="
        M0,160 C150,190 300,130 450,160 C600,190 750,130 900,160 L900,200 L0,200 Z;
        M0,150 C150,120 300,180 450,150 C600,120 750,180 900,150 L900,200 L0,200 Z;
        M0,160 C150,190 300,130 450,160 C600,190 750,130 900,160 L900,200 L0,200 Z
      "/>
  </path>
  <path fill="#0d1117" opacity="0.4">
    <animate attributeName="d" dur="6s" repeatCount="indefinite"
      values="
        M0,175 C150,150 300,195 450,175 C600,155 750,195 900,175 L900,200 L0,200 Z;
        M0,180 C150,200 300,155 450,180 C600,200 750,155 900,180 L900,200 L0,200 Z;
        M0,175 C150,150 300,195 450,175 C600,155 750,195 900,175 L900,200 L0,200 Z
      "/>
  </path>

  <!-- Typing text, revealed via clip-path -->
  <g clip-path="url(#revealClip)">
    <text x="450" y="90" font-family="Poppins, 'Segoe UI', sans-serif" font-size="42" font-weight="800" fill="#ffffff" text-anchor="middle">
      Hi 👋, I'm Shifan NV
    </text>
  </g>

  <!-- Blinking cursor, positioned at end of text, disappears after typing -->
  <rect x="620" y="60" width="4" height="42" fill="#ffffff">
    <animate attributeName="opacity" values="1;0;1" dur="0.8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" from="1" to="0" begin="2.5s" dur="0.01s" fill="freeze"/>
  </rect>

  <!-- Subtitle, fades in after typing completes -->
  <text x="450" y="130" font-family="'Fira Code', monospace" font-size="20" font-weight="500" fill="#e0d4f7" text-anchor="middle" opacity="0">
    Full Stack Developer
    <animate attributeName="opacity" from="0" to="1" begin="2.6s" dur="1s" fill="freeze"/>
  </text>
</svg>
